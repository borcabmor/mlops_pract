name: CD
on:
  push:
    branches: ["master"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -f Dockerfile.api \
            -t ghcr.io/${{ github.repository }}/abusive-hosting-api:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}/abusive-hosting-api:latest