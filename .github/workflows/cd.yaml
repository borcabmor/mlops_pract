name: CD

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build imagen
        run: |
          docker build \
            -f Dockerfile.api \
            -t ghcr.io/${{ github.repository_owner }}/abusive-hosting-api:latest \
            .

      - name: Push imagen
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/abusive-hosting-api:latest